[project]
name = "kremetart"
version = "0.1.0"
description = "Kalman Real-time Evidence Monitoring Extractor for TART"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "landmanbester", email = "lbester@sarao.ac.za" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "typer>=0.12.0",
    "astropy-healpix>=1.0",
    "pyyaml>=6.0",
    "numpy>=2.0.0",
    "scipy>=1.15.0",
    "xarray>=2025.0",
    "astropy>=6.0.0",
    "zarr>=2.18.3",
    # The GPU stack is Linux-only: Holoscan ships Linux wheels only, and CyberEther only has CUDA builds there.
    "holoscan-cu13>=4.3.0 ; sys_platform == 'linux'",
    "dask[array]>=2024.1.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    # CUDA-13 cuBLAS for cupy-cuda13x's GPU kernels (einsum/matmul in the HEALPix DFT).
    # cupy-cuda13x finds it via cuda-pathfinder but does not pull it, and the system CUDA-13
    # toolkit here ships no cuBLAS. NB: the real wheel is unsuffixed "nvidia-cublas"; the
    # "nvidia-cublas-cu13" name is only a 0.0.1 redirect stub.
    "nvidia-cublas>=13.0,<14 ; sys_platform == 'linux'",
    "tart-tools>=1.4.5",
    "tart-msv4>=0.1.2",
]

[project.urls]
Homepage = "https://github.com/landmanbester/kremetart"
Repository = "https://github.com/landmanbester/kremetart"
"Bug Tracker" = "https://github.com/landmanbester/kremetart/issues"

[project.scripts]
kremetart = "kremetart.cli:app"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["N802", "N803", "N812"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Tests that take more time to run",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
    "tbump>=6.11.0",
    "pre-commit>=4.0.0",
    "ipdb",
]
docs = [
    "furo>=2025.7",
    "myst-parser>=4.0",
    "sphinx>=8.1",
    "sphinx-llms-txt>=0.7",
]
test = [
    "pytest>=8.0.0",
    # Measurement Set oracles (tart2ms comparisons); casacore has no Windows wheels.
    "arcae>=0.5.2,<0.6.0 ; sys_platform != 'win32'",
    "xarray-ms>=0.5.5 ; sys_platform != 'win32'",
    "pytest-cov>=5.0.0",
    # The reference HEALPix implementation the astropy-healpix geometry is checked against; no Windows wheels.
    "healpy>=1.19.0 ; sys_platform != 'win32'",
    "gdown>=5.0.0",
]
