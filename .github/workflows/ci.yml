name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    env:
      SKIP_CHECKS: 'false'
    steps:
      - name: Check for skip checks
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          MSG=$(gh api repos/${{ github.repository }}/commits/$COMMIT_SHA --jq '.commit.message')
          if echo "$MSG" | grep -qF '[skip checks]'; then
            echo "SKIP_CHECKS=true" >> "$GITHUB_ENV"
            echo "Skipping checks because [skip checks] was found in the commit message."
          fi

      - name: Check out code
        if: env.SKIP_CHECKS != 'true'
        uses: actions/checkout@v7

      - name: Set up Python
        if: env.SKIP_CHECKS != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up uv
        if: env.SKIP_CHECKS != 'true'
        uses: astral-sh/setup-uv@v7

      - name: Cache uv dependencies
        if: env.SKIP_CHECKS != 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        if: env.SKIP_CHECKS != 'true'
        run: uv sync --group dev

      - name: Check code formatting
        if: env.SKIP_CHECKS != 'true'
        run: uv run ruff format --check .

      - name: Lint code
        if: env.SKIP_CHECKS != 'true'
        run: uv run ruff check .

  test:
    # Linux gets every supported Python; macOS (Apple Silicon) and Windows run one, to bound CI time.
    # No runner has a GPU, so the Holoscan/CuPy tests skip everywhere; the loop and CyberEther (CPU)
    # runners are tested on every platform.
    name: Tests (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    env:
      SKIP_CHECKS: 'false'
      CYBERETHER_VERSION: v1.19.0
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python-version: "3.11", cyberether: cyberether-linux-x86_64 }
          - { os: ubuntu-latest, python-version: "3.12", cyberether: cyberether-linux-x86_64 }
          - { os: ubuntu-latest, python-version: "3.13", cyberether: cyberether-linux-x86_64 }
          - { os: macos-14, python-version: "3.12", cyberether: cyberether-macos-arm64 }
          - { os: windows-latest, python-version: "3.12", cyberether: cyberether-windows-x86_64 }

    steps:
      - name: Check for skip checks
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          MSG=$(gh api repos/${{ github.repository }}/commits/$COMMIT_SHA --jq '.commit.message')
          if echo "$MSG" | grep -qF '[skip checks]'; then
            echo "SKIP_CHECKS=true" >> "$GITHUB_ENV"
            echo "Skipping checks because [skip checks] was found in the commit message."
          fi

      - name: Check out code
        if: env.SKIP_CHECKS != 'true'
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        if: env.SKIP_CHECKS != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        if: env.SKIP_CHECKS != 'true'
        uses: astral-sh/setup-uv@v7

      - name: Cache uv dependencies
        if: env.SKIP_CHECKS != 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-py${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-py${{ matrix.python-version }}-
            ${{ runner.os }}-uv-

      - name: Install dependencies
        if: env.SKIP_CHECKS != 'true'
        run: uv sync --group test

      # The CyberEther runner tests need the CyberEther executable. The portable builds are the
      # executable plus one library; headless CyberEther still opens a Vulkan device, which GPU-less
      # Linux runners get from Mesa's software driver (lavapipe).
      - name: Install Vulkan (software)
        if: env.SKIP_CHECKS != 'true' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvulkan1 mesa-vulkan-drivers libgudev-1.0-0

      - name: Cache CyberEther
        if: env.SKIP_CHECKS != 'true'
        id: cyberether-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/cyberether
          key: ${{ matrix.cyberether }}-${{ env.CYBERETHER_VERSION }}

      - name: Download CyberEther
        if: env.SKIP_CHECKS != 'true' && steps.cyberether-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/cyberether"
          curl -fsSL -o "$RUNNER_TEMP/cyberether.tar.gz" \
            "https://github.com/luigifcruz/CyberEther/releases/download/$CYBERETHER_VERSION/${{ matrix.cyberether }}.tar.gz"
          tar xzf "$RUNNER_TEMP/cyberether.tar.gz" -C "$RUNNER_TEMP/cyberether"

      - name: Point the tests at CyberEther
        if: env.SKIP_CHECKS != 'true'
        run: |
          exe="$RUNNER_TEMP/cyberether/cyberether"
          [ "$RUNNER_OS" = "Windows" ] && exe="$exe.exe"
          echo "KREMETART_CYBERETHER=$exe" >> "$GITHUB_ENV"

      - name: Run tests
        if: env.SKIP_CHECKS != 'true'
        run: uv run pytest -v -rs
